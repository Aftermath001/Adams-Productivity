<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · Adams Productivity Hub</title><link rel="stylesheet" href="/theme.css"><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 20% 10%,#283247,#10141d 55%);font:15px Inter,system-ui;color:var(--text)}main{width:min(92vw,420px);background:#191f2bf2;border:1px solid var(--border);border-radius:22px;padding:36px;box-shadow:0 24px 70px #0006}h1{margin:0 0 8px;font-size:25px}.gold{color:var(--brand)}p{color:var(--text-dim);line-height:1.6}input,button{width:100%;height:48px;border-radius:10px;margin-top:12px;font:inherit}input{background:#111722;border:1px solid var(--border);padding:0 14px;color:white}button{border:0;background:var(--brand);color:#171717;font-weight:700;cursor:pointer}button:disabled{opacity:.5}.secondary{background:transparent;color:var(--text-dim);border:1px solid var(--border)}#msg{min-height:22px;font-size:13px}.err{color:#ff8d8d!important}[hidden]{display:none!important}</style></head><body><main><div class="gold" style="font-weight:800;letter-spacing:2px;font-size:12px">ADAMS / PRODUCTIVITY HUB</div><h1 id="heading">Your focus starts here.</h1><p id="sub">Sign in with your email. We'll send a one-time verification code.</p><form id="form"><input id="email" type="email" placeholder="Email address" autocomplete="username webauthn" required><input id="code" inputmode="numeric" autocomplete="one-time-code" placeholder="6-digit code" hidden><button id="submit">Continue with email</button><button id="back" class="secondary" type="button" hidden>Change email</button></form><section id="passkey" hidden><p>Add a passkey for faster sign-in using your device's fingerprint, face or screen lock.</p><button id="add">Add passkey</button><button id="skip" class="secondary">Not now</button></section><p id="msg" role="status"></p></main><script>(()=>{const A=window.hatchable.auth,form=document.querySelector('#form'),email=document.querySelector('#email'),code=document.querySelector('#code'),submit=document.querySelector('#submit'),back=document.querySelector('#back'),msg=document.querySelector('#msg'),pass=document.querySelector('#passkey');let step=0,has=false;const next=()=>{let n=new URLSearchParams(location.search).get('next')||'/';location.replace(n.startsWith('/')&&!n.startsWith('//')&&!n.includes('\\')?n:'/')};const say=(s,e=false)=>{msg.textContent=s;msg.className=e?'err':''};if(!A){say('Authentication is unavailable. Refresh and try again.',true);return}A.getSession().then(s=>{if(s?.user)next()}).catch(()=>{});form.onsubmit=async e=>{e.preventDefault();submit.disabled=true;try{if(!step){const r=await A.startLogin({email:email.value.trim()});has=!!r.has_passkey;if(has&&A.supportsPasskeys()){try{await A.signInWithPasskey({email:email.value.trim()});next();return}catch(_){}}step=1;code.hidden=false;back.hidden=false;submit.textContent='Verify and sign in';say('A verification code has been sent to your email.')}else{await A.verifyCode({email:email.value.trim(),code:code.value.trim()});form.hidden=true;if(!has&&A.supportsPasskeys()&&localStorage.getItem('aph_no_passkey')!=='1'){pass.hidden=false;document.querySelector('#heading').textContent='Make sign-in effortless';document.querySelector('#sub').textContent='One more step: add a secure passkey.'}else next()}}catch(err){say(err.message||'Something went wrong. Please try again.',true)}finally{submit.disabled=false}};back.onclick=()=>{step=0;code.hidden=true;back.hidden=true;submit.textContent='Continue with email';say('')};document.querySelector('#add').onclick=async()=>{try{await A.registerPasskey();next()}catch(e){say(e.message||'Passkey could not be added.',true)}};document.querySelector('#skip').onclick=()=>{localStorage.setItem('aph_no_passkey','1');next()};})();</script></body></html>
